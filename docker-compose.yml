services:
  prevju:
    image: ${PREVJU_IMAGE:-prevju:latest}
    build: .
    restart: unless-stopped
    ports:
      - "${PREVJU_PORT:-8080}:8080"
    environment:
      APP_KEY: "${APP_KEY:?APP_KEY missing, generate with: docker compose run --rm prevju php artisan key:generate --show}"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:?ADMIN_EMAIL missing}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD missing}"
    volumes:
      - prevju-data:/var/www/html/storage/app

volumes:
  prevju-data:
